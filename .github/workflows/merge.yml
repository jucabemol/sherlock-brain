# The shared brain's nightly merge: the inbox + the last release → a new release (old ones are never deleted).
name: merge
on:
  schedule: [{ cron: '17 6 * * *' }]   # 03:17 in Brasília
  workflow_dispatch: {}
permissions:
  contents: write                      # to publish the release
concurrency: { group: merge, cancel-in-progress: false }
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install numpy==2.1.3
      - run: python merge.py --work work
        env:
          REPO: ${{ github.repository }}
          INBOX: ${{ vars.INBOX_URL }}
          MERGE_TOKEN: ${{ secrets.MERGE_TOKEN }}
          OWNER_INSTALLS: ${{ vars.OWNER_INSTALLS }}
          GH_TOKEN: ${{ github.token }}
